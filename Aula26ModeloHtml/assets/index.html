<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Exercício de JavaScript</title>

    <!-- Conecta o arquivo CSS ao HTML -->
    <link rel="stylesheet" href="./css/style.css" />

    <!--
      Conecta o JavaScript ao HTML.
      O atributo defer faz o navegador esperar o carregamento do HTML
      antes de executar o código JavaScript.
    -->
    <script src="./js/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Exercício de JavaScript</h1>

      <p>
        Use esta página como modelo para praticar os conteúdos das aulas.
      </p>

      <!-- Área para inserir formulários, botões e outros elementos -->
      <section class="exercise-area">
        <h2>Área do exercício</h2>

        <button id="test-button" type="button">Executar teste</button>

        <!-- O JavaScript poderá escrever resultados nesta área -->
        <div id="result"></div>
      </section>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios</title>
  <script src="js/script.js" defer></script>
</head>
<body>

  <form class="form">
    <p>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" class="nome">
    </p>

    <p>
      <label for="sobrenome">Sobrenome:</label>
      <input type="text" id="sobrenome" name="sobrenome" class="sobrenome">
    </p>

    <p>
      <label for="peso">Peso:</label>
      <input type="number" id="peso" name="peso" class="peso" step="0.01">
    </p>

    <p>
      <label for="altura">Altura:</label>
      <input type="number" id="altura" name="altura" class="altura" step="0.01">
    </p>

    <button type="submit">Enviar</button>
  </form>

  <div class="resultado"></div>

</body>
</html>
